
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: camilytec
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8B5FBF&color_dots=F1EAF8,B58AD6,8B5FBF,6A3D91,3B1D55
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=B58AD6&color_dots=2D1B3D,5B347A,8B5FBF,B58AD6,E6D5F5

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
