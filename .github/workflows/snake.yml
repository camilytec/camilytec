name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: camilytec
          
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5FBF&color_dots=%23F1EAF8,%23DCC5EF,%23B58AD6,%238B5FBF,%236A3D91
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23B58AD6&color_dots=%232D1B3D,%235B347A,%238B5FBF,%23B58AD6,%23E6D5F5

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
